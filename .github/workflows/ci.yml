name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and API smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Run API and assistant unit tests
        run: python -m pytest -q

      - name: Check API against the included data
        run: python -m scripts.smoke_api

      - name: Run the three mock assistant examples
        run: python -m question_6_genai.agent --mode mock

  r-package:
    name: R package check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: question_1/descriptive_stats
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build, test, and check descriptiveStats
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: question_1/descriptive_stats
          args: 'c("--no-manual", "--no-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"warning"'
          upload-results: never
